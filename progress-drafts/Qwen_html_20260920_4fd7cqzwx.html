<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<style>
  :root {
    --bg-body: #0f0f0f;
    --bg-phone: #121212;
    --bg-card: #1E1E1E;
    --bg-elev: #2A2A2A;
    --border: #222;
    --text: #FFF;
    --text-dim: #888;
    --text-mute: #666;
    --bg-selected: #232B27;
    --shadow: rgba(0, 0, 0, 0.5);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg-body: #F5F5F5;
      --bg-phone: #FFFFFF;
      --bg-card: #F0F0F0;
      --bg-elev: #E5E5E5;
      --border: #DDDDDD;
      --text: #1A1A1A;
      --text-dim: #555;
      --text-mute: #888;
      --bg-selected: #C8E6C9;
      --shadow: rgba(0, 0, 0, 0.08);
    }
  }

body { background: var(--bg-body); font-family: -apple-system, sans-serif; display: flex; justify-content: center; padding: 20px 0; margin: 0; }
  .phone { width: 380px; background: var(--bg-phone); border-radius: 32px; padding: 20px; color: var(--text); }

  .tabs { display: flex; background: var(--bg-card); border-radius: 12px; padding: 4px; margin-bottom: 20px; }
  .tab { flex: 1; text-align: center; padding: 10px; border-radius: 10px; font-size: 14px; font-weight: 600; color: var(--text-dim); }
  .tab.active { background: #FF9100; color: #000; }

  .big-metric { text-align: center; background: linear-gradient(135deg, #E65100, #FF9100); padding: 24px; border-radius: 20px; margin-bottom: 24px;}
  .big-label { font-size: 12px; opacity: 0.9; text-transform: uppercase; letter-spacing: 1px;}
  .big-val { font-size: 48px; font-weight: bold; margin: 8px 0; }
  .big-sub { font-size: 14px; opacity: 0.9; }

  .section-title { font-size: 14px; font-weight: 600; color: var(--text-dim); margin-bottom: 12px; }
  .balance-card { background: var(--bg-card); padding: 16px; border-radius: 16px; margin-bottom: 24px; }
  .balance-row { margin-bottom: 14px; }
  .balance-row:last-child { margin-bottom: 0; }
  .balance-header { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; }
  .balance-bar { height: 8px; background: var(--bg-elev); border-radius: 4px; overflow: hidden; }
  .balance-fill { height: 100%; border-radius: 4px; }
  .fill-push { background: #FF5252; width: 35%; }
  .fill-pull { background: #448AFF; width: 30%; }
  .fill-legs { background: #69F0AE; width: 20%; }
  .fill-core { background: #E040FB; width: 10%; }
  .fill-cardio { background: #FFD740; width: 5%; }

  .chart-title { font-size: 14px; font-weight: 600; color: var(--text-dim); margin-bottom: 12px; }
  .bar-chart { display: flex; justify-content: space-between; align-items: flex-end; height: 100px; background: var(--bg-card); padding: 16px 12px 8px; border-radius: 16px; }
  .bar-col { display: flex; flex-direction: column; align-items: center; flex: 1; }
  .bar { width: 16px; background: #FF9100; border-radius: 4px; margin-bottom: 6px; }
  .bar.empty { background: var(--bg-elev); }
  .bar-label { font-size: 10px; color: var(--text-mute); }
</style>
</head>
<body>

<div class="phone">
  <div class="tabs">
    <div class="tab active">Повторения</div>
    <div class="tab">Баланс</div>
  </div>

  <div class="big-metric">
    <div class="big-label">Всего повторений (Неделя)</div>
    <div class="big-val">840</div>
    <div class="big-sub">▲ +120 к прошлой неделе</div>
  </div>

  <div class="section-title">Баланс категорий движений</div>
  <div class="balance-card">
    <div class="balance-row">
      <div class="balance-header"><span>🫸 PUSH (Отжимания)</span><span>294</span></div>
      <div class="balance-bar"><div class="balance-fill fill-push"></div></div>
    </div>
    <div class="balance-row">
      <div class="balance-header"><span>🫷 PULL (Подтягивания)</span><span>252</span></div>
      <div class="balance-bar"><div class="balance-fill fill-pull"></div></div>
    </div>
    <div class="balance-row">
      <div class="balance-header"><span>🦵 LEGS (Приседания)</span><span>168</span></div>
      <div class="balance-bar"><div class="balance-fill fill-legs"></div></div>
    </div>
    <div class="balance-row">
      <div class="balance-header"><span>🧘 CORE (Пресс)</span><span>84</span></div>
      <div class="balance-bar"><div class="balance-fill fill-core"></div></div>
    </div>
    <div class="balance-row">
      <div class="balance-header"><span>🏃 CARDIO</span><span>42</span></div>
      <div class="balance-bar"><div class="balance-fill fill-cardio"></div></div>
    </div>
  </div>

  <div class="chart-title">Повторения по дням</div>
  <div class="bar-chart">
    <div class="bar-col"><div class="bar" style="height: 60%;"></div><div class="bar-label">Пн</div></div>
    <div class="bar-col"><div class="bar empty" style="height: 10%;"></div><div class="bar-label">Вт</div></div>
    <div class="bar-col"><div class="bar" style="height: 80%;"></div><div class="bar-label">Ср</div></div>
    <div class="bar-col"><div class="bar empty" style="height: 10%;"></div><div class="bar-label">Чт</div></div>
    <div class="bar-col"><div class="bar" style="height: 100%;"></div><div class="bar-label">Пт</div></div>
    <div class="bar-col"><div class="bar" style="height: 40%;"></div><div class="bar-label">Сб</div></div>
    <div class="bar-col"><div class="bar empty" style="height: 10%;"></div><div class="bar-label">Вс</div></div>
  </div>
</div>

</body>
</html>
