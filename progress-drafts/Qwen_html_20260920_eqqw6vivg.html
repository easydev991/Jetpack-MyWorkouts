<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<style>
  :root {
    --bg-body: #0f0f0f;
    --bg-phone: #121212;
    --bg-card: #1E1E1E;
    --bg-elev: #2A2A2A;
    --border: #222;
    --text: #FFF;
    --text-dim: #888;
    --text-mute: #666;
    --bg-selected: #232B27;
    --shadow: rgba(0, 0, 0, 0.5);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg-body: #F5F5F5;
      --bg-phone: #FFFFFF;
      --bg-card: #F0F0F0;
      --bg-elev: #E5E5E5;
      --border: #DDDDDD;
      --text: #1A1A1A;
      --text-dim: #555;
      --text-mute: #888;
      --bg-selected: #C8E6C9;
      --shadow: rgba(0, 0, 0, 0.08);
    }
  }

body { background: var(--bg-body); font-family: -apple-system, sans-serif; display: flex; justify-content: center; padding: 20px 0; margin: 0; }
  .phone { width: 380px; background: var(--bg-phone); border-radius: 32px; padding: 20px; color: var(--text); }

  .title { font-size: 20px; font-weight: bold; margin-bottom: 20px; }

  /* Hero-метрика: всего повторений */
  .density-card { background: linear-gradient(135deg, #1A237E, #3949AB); padding: 24px; border-radius: 20px; text-align: center; margin-bottom: 24px;}
  .density-icon { font-size: 32px; margin-bottom: 8px;}
  .density-label { font-size: 12px; color: #9FA8DA; text-transform: uppercase; letter-spacing: 1px;}
  .density-val { font-size: 36px; font-weight: bold; margin: 8px 0; }
  .density-sub { font-size: 13px; color: #81D4FA; }

  /* Средняя интенсивность (повторений за тренировку) */
  .avg-card { background: var(--bg-card); padding: 16px; border-radius: 16px; text-align: center; margin-bottom: 24px;}
  .avg-label { font-size: 12px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px;}
  .avg-val { font-size: 28px; font-weight: bold; margin: 6px 0; color: #69F0AE;}
  .avg-sub { font-size: 13px; color: var(--text-dim); }

  /* Список последних тренировок — дата + сумма повторений */
  .section-title { font-size: 14px; font-weight: 600; color: var(--text-dim); margin-bottom: 12px; }
  .workouts { background: var(--bg-card); border-radius: 16px; overflow: hidden;}
  .workout-item { padding: 14px 16px; display: flex; justify-content: space-between; border-bottom: 1px solid var(--border);}
  .workout-item:last-child { border-bottom: none;}
  .workout-date { font-size: 12px; color: var(--text-dim);}
  .workout-name { font-size: 14px; font-weight: 500; margin-top: 2px;}
  .workout-val { text-align: right;}
  .workout-val-num { font-size: 16px; font-weight: bold; color: #448AFF;}
  .workout-val-unit { font-size: 11px; color: var(--text-dim);}
</style>
</head>
<body>

<div class="phone">
  <div class="title">Интенсивность</div>

  <!-- Было: "Средняя плотность повт/мин" — нет данных о длительности тренировки.
       Заменено на "Всего повторений" — sum(reps) по entries. -->
  <div class="density-card">
    <div class="density-icon">💪</div>
    <div class="density-label">Всего повторений (Неделя)</div>
    <div class="density-val">840</div>
    <div class="density-sub">▲ +120 к прошлой неделе</div>
  </div>

  <!-- В среднем повторений за тренировку (по дням с записями) -->
  <div class="avg-card">
    <div class="avg-label">В среднем за тренировку</div>
    <div class="avg-val">210 повторений</div>
    <div class="avg-sub">за 4 тренировки</div>
  </div>

  <!-- Было: "Цели и Челленджи" — удалено: целей/челленджей в приложении нет. -->

  <div class="section-title">Последние тренировки</div>
  <div class="workouts">
    <div class="workout-item">
      <div>
        <div class="workout-date">18 Сентября</div>
        <div class="workout-name">Push (Отжимания)</div>
      </div>
      <div class="workout-val">
        <div class="workout-val-num">280</div>
        <div class="workout-val-unit">повторений</div>
      </div>
    </div>
    <div class="workout-item">
      <div>
        <div class="workout-date">16 Сентября</div>
        <div class="workout-name">Pull (Подтягивания)</div>
      </div>
      <div class="workout-val">
        <div class="workout-val-num">180</div>
        <div class="workout-val-unit">повторений</div>
      </div>
    </div>
    <div class="workout-item">
      <div>
        <div class="workout-date">14 Сентября</div>
        <div class="workout-name">Legs (Приседания)</div>
      </div>
      <div class="workout-val">
        <div class="workout-val-num">220</div>
        <div class="workout-val-unit">повторений</div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
